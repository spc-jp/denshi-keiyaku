<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご捺印のお願い｜電子契約みっけ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMyMjM2NzAiLz48cmVjdCB4PSIxMiIgeT0iMTIiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcng9IjExIiBmaWxsPSIjRDBBOTAwIi8+PHRleHQgeD0iMzIiIHk9IjMzIiBmb250LWZhbWlseT0iJ1l1IEdvdGhpYycsJ0hpcmFnaW5vIEtha3UgR290aGljIFByb04nLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMzAiIGZvbnQtd2VpZ2h0PSI4MDAiIGZpbGw9IiMyMjM2NzAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJjZW50cmFsIj7ljbA8L3RleHQ+PC9zdmc+">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --navy:#223670; --navy-soft:#33488a; --gold:#D0A900;
    --ink:#1c2333; --paper:#f5f6fa; --line:#dfe3ee; --vermilion:#d0111b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.7;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-soft));color:#fff;
    padding:20px;border-bottom:3px solid var(--gold);text-align:center;}
  header h1{font-size:19px;margin:0;}
  header p{font-size:13px;margin:4px 0 0;opacity:.9;}
  main{max-width:820px;margin:0 auto;padding:18px 14px 120px;}

  .guide{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(34,54,112,.05);}
  .guide h2{color:var(--navy);font-size:16px;margin:0 0 10px;}
  .guide ol{margin:0;padding-left:1.3em;}
  .guide li{font-size:15px;margin-bottom:6px;}
  .guide li b{color:var(--vermilion);}

  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:800;
    border-radius:12px;transition:transform .05s ease,filter .15s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-xl{font-size:18px;padding:18px 24px;width:100%;box-shadow:0 4px 14px rgba(34,54,112,.18);}

  .openbox{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:30px 18px;text-align:center;}
  .openbox p{color:#5a6480;font-size:14px;margin:10px 0 0;}
  input[type=file]{display:none;}

  #stage{display:none;text-align:center;}
  #previewWrap{position:relative;display:inline-block;max-width:100%;
    box-shadow:0 4px 18px rgba(34,54,112,.15);border-radius:6px;overflow:hidden;background:#fff;}
  #pdfCanvas{display:block;max-width:100%;height:auto;}
  #overlay{position:absolute;inset:0;}

  .drop{position:absolute;touch-action:none;cursor:grab;user-select:none;}
  .drop img{display:block;width:100%;height:100%;pointer-events:none;}

  /* 未捺印の印：半透明＋点滅＋赤枠 */
  .seal-el{border:2px dashed var(--vermilion);border-radius:8px;}
  .seal-el.wait{opacity:.5;animation:blink 1s ease-in-out infinite;}
  .seal-el.done{opacity:1;border-color:transparent;}
  @keyframes blink{0%,100%{opacity:.35;}50%{opacity:.75;}}
  .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:var(--vermilion);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;}
  .seal-el.done .tag{display:none;}
  .check{position:absolute;top:-12px;right:-12px;width:26px;height:26px;border-radius:50%;
    background:#1a9e5a;color:#fff;border:2px solid #fff;display:none;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;}
  .seal-el.done .check{display:flex;}

  /* 日付の枠 */
  .date-el{display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--navy);border-radius:8px;background:rgba(255,255,255,.85);
    color:var(--navy);font-size:13px;font-weight:700;text-align:center;padding:4px;}
  .date-el.wait{animation:blinkB 1.1s ease-in-out infinite;}
  .date-el.done{border-color:transparent;background:transparent;}
  @keyframes blinkB{0%,100%{background:rgba(208,169,0,.18);}50%{background:rgba(208,169,0,.42);}}
  .date-el .tagB{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;}
  .date-el.done .tagB{display:none;}

  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(34,54,112,.08);z-index:50;display:none;}
  .savebar .inner{max-width:820px;margin:0 auto;}
  .status{font-size:12px;color:#8891a8;text-align:center;margin-top:8px;}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  input[type=date].hidden-date{position:fixed;left:-9999px;opacity:0;}
</style>
</head>
<body>
<header>
  <h1>ご捺印のお願い</h1>
  <p id="subHead">下の3ステップで、日付とご捺印をお願いいたします</p>
</header>

<main>
  <div class="guide">
    <h2>かんたん3ステップ</h2>
    <ol>
      <li><b>日付</b>の枠をタップして、カレンダーから契約日を選びます</li>
      <li><b>印鑑</b>（点滅しています）をタップして、ご捺印します</li>
      <li>下の<b>保存ボタン</b>を押して、返信メールに添付してください</li>
    </ol>
  </div>

  <!-- PDFを開く -->
  <div class="openbox" id="openbox">
    <button class="btn btn-navy btn-xl" id="openBtn">契約書（PDF）を開く</button>
    <p>メールに添付された契約書PDFを選んでください。<br>ファイルはこの画面の中だけで処理され、外部には送信されません。</p>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <!-- 作業ステージ -->
  <div id="stage">
    <div id="previewWrap">
      <canvas id="pdfCanvas"></canvas>
      <div id="overlay"></div>
    </div>
    <div class="pagenav" id="pagenav" style="display:none;margin:12px 0;">
      <button class="btn btn-navy" style="padding:8px 14px;font-size:13px;" onclick="changePage(-1)">前へ</button>
      <span id="pageInfo" style="margin:0 12px;font-weight:700;color:#5a6480;">1 / 1</span>
      <button class="btn btn-navy" style="padding:8px 14px;font-size:13px;" onclick="changePage(1)">次へ</button>
    </div>
  </div>
</main>

<!-- 下部の保存バー -->
<div class="savebar" id="savebar">
  <div class="inner">
    <button class="btn btn-gold btn-xl" id="saveBtn" onclick="savePdf()">押印済みPDFを保存する</button>
    <div class="status" id="status">日付と捺印がお済みでない場合はご案内が出ます</div>
  </div>
</div>

<input type="date" id="dateInput" class="hidden-date">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ===== 甲がリンクで渡す設定（URLパラメータ） =====
// 例: okyakusama-oshiin.html?name=株式会社サンプル&center=代表取締役印
const params = new URLSearchParams(location.search);
const CFG = {
  name:   params.get('name')   || 'サンプル株式会社',
  center: params.get('center') || '代表取締役印',
  color:  params.get('color')  || '#d0111b',
  sealCx: parseFloat(params.get('sx')) || 0.80,
  sealCy: parseFloat(params.get('sy')) || 0.82,
  dateCx: parseFloat(params.get('dx')) || 0.34,
  dateCy: parseFloat(params.get('dy')) || 0.82,
};
document.getElementById('subHead').textContent = CFG.name + ' 御中｜日付とご捺印をお願いいたします';

let pdfDoc=null, originalBytes=null, currentPage=1, totalPages=1;
const overlay=document.getElementById('overlay');
const pdfCanvas=document.getElementById('pdfCanvas');

// 配置物（印1つ・日付1つ）
const seal = { cx:CFG.sealCx, cy:CFG.sealCy, wFrac:0.15, aspect:1, done:false, dataUrl:null, el:null };
const dateI= { cx:CFG.dateCx, cy:CFG.dateCy, wFrac:0.30, aspect:0.28, done:false, dataUrl:null, el:null, str:'' };

// ===== ファイルを開く =====
document.getElementById('openBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  const buf=await f.arrayBuffer();
  originalBytes=new Uint8Array(buf.slice(0));
  pdfDoc=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  totalPages=pdfDoc.numPages; currentPage=1;
  // 印の画像を用意
  seal.dataUrl = buildSeal(CFG.name, CFG.center, CFG.color);
  document.getElementById('openbox').style.display='none';
  document.getElementById('stage').style.display='block';
  document.getElementById('savebar').style.display='block';
  document.getElementById('pagenav').style.display = totalPages>1?'block':'none';
  await renderPage();
  toast('契約書を開きました。日付と印をタップしてください。');
};

async function renderPage(){
  const page=await pdfDoc.getPage(currentPage);
  const cw=document.querySelector('main').clientWidth||720;
  const base=page.getViewport({scale:1});
  let scale=Math.min((cw-4)/base.width,1.6); if(scale<0.2) scale=0.2;
  const vp=page.getViewport({scale});
  const ctx=pdfCanvas.getContext('2d');
  pdfCanvas.width=vp.width; pdfCanvas.height=vp.height; pdfCanvas.style.width=vp.width+'px';
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  document.getElementById('pageInfo').textContent=`${currentPage} / ${totalPages}`;
  renderOverlay();
}
function changePage(d){ const n=currentPage+d; if(n<1||n>totalPages) return; currentPage=n; renderPage(); }

// ===== 印・日付の表示（1ページ目にのみ配置） =====
function renderOverlay(){
  overlay.innerHTML='';
  if(currentPage!==1) return;   // 署名欄は通常1ページ目
  overlay.appendChild(buildDateEl());
  overlay.appendChild(buildSealEl());
}
function positionEl(el,it){
  const w=overlay.clientWidth,h=overlay.clientHeight;
  const width=it.wFrac*w, height=width*it.aspect;
  el.style.width=width+'px'; el.style.height=height+'px';
  el.style.left=(it.cx*w-width/2)+'px'; el.style.top=(it.cy*h-height/2)+'px';
}
function buildSealEl(){
  const el=document.createElement('div');
  el.className='drop seal-el '+(seal.done?'done':'wait');
  const img=document.createElement('img'); img.src=seal.dataUrl; el.appendChild(img);
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent='ここをタップして捺印'; el.appendChild(tag);
  const ck=document.createElement('div'); ck.className='check'; ck.textContent='✓'; el.appendChild(ck);
  seal.el=el; positionEl(el,seal);
  makeInteractive(el,seal,()=>{ seal.done=true; el.className='drop seal-el done'; refreshStatus(); toast('捺印しました。'); });
  return el;
}
function buildDateEl(){
  const el=document.createElement('div');
  el.className='drop date-el '+(dateI.done?'done':'wait');
  if(dateI.done){ const img=document.createElement('img'); img.src=dateI.dataUrl; el.appendChild(img); }
  else { el.textContent='📅 タップして日付を選ぶ'; }
  const tag=document.createElement('div'); tag.className='tagB'; tag.textContent='ここをタップして日付を選ぶ'; el.appendChild(tag);
  dateI.el=el; positionEl(el,dateI);
  makeInteractive(el,dateI,openDatePicker);
  return el;
}

// ドラッグ＋タップ判定
function makeInteractive(el,it,onTap){
  el.onpointerdown=e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const rect=overlay.getBoundingClientRect();
    const sx=e.clientX, sy=e.clientY; let moved=false;
    const move=ev=>{
      if(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6) moved=true;
      it.cx=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
      it.cy=Math.max(0,Math.min(1,(ev.clientY-rect.top)/rect.height));
      positionEl(el,it);
    };
    const up=()=>{
      el.releasePointerCapture(e.pointerId);
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
      if(!moved && onTap) onTap();
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
  };
}

// ===== カレンダーで日付選択 =====
const dateInput=document.getElementById('dateInput');
function todayStr(){ const t=new Date(),z=n=>String(n).padStart(2,'0'); return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}`; }
function openDatePicker(){
  if(!dateInput.value) dateInput.value=todayStr();  // 初期は今日
  if(dateInput.showPicker){ try{ dateInput.showPicker(); return; }catch(_){} }
  dateInput.click();
}
dateInput.onchange=()=>{
  const [y,m,d]=dateInput.value.split('-').map(Number);
  dateI.str=warekiText(y,m,d);
  const img=makeTextImage(dateI.str);
  dateI.dataUrl=img.dataUrl; dateI.aspect=img.aspect; dateI.done=true;
  renderOverlay(); refreshStatus(); toast('日付を入れました：'+dateI.str);
};
function warekiText(y,m,d){
  const dt=new Date(y,m-1,d), start=new Date(2019,4,1);
  if(dt>=start){ const ry=y-2018; return `令和${ry===1?'元':ry}年${m}月${d}日`; }
  return `${y}年${m}月${d}日`;
}

// ===== 画像づくり =====
function makeTextImage(text){
  const c=document.createElement('canvas'); const m=c.getContext('2d');
  const fs=64; m.font=`600 ${fs}px "Yu Mincho","Hiragino Mincho ProN",serif`;
  const w=Math.ceil(m.measureText(text).width)+24, h=fs+24;
  c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.font=`600 ${fs}px "Yu Mincho","Hiragino Mincho ProN",serif`;
  g.textBaseline='middle'; g.fillStyle='#111'; g.fillText(text,12,h/2);
  return {dataUrl:c.toDataURL('image/png'), aspect:h/w};
}
function buildSeal(outer,center,color){
  const S=300,cx=S/2,cy=S/2,R=140;
  const c=document.createElement('canvas'); c.width=S; c.height=S;
  const ctx=c.getContext('2d');
  ctx.strokeStyle=color; ctx.fillStyle=color;
  ctx.lineWidth=9; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  const chars=[...outer];
  if(chars.length){
    const fs=Math.min(34,300/(chars.length*0.9));
    ctx.font=`700 ${fs}px "Yu Mincho","Hiragino Mincho ProN",serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const per=Math.min((fs*1.15)/(R-24),Math.PI*1.7/chars.length+0.001);
    const total=per*chars.length, rT=R-26;
    ctx.save(); ctx.translate(cx,cy);
    chars.forEach((ch,i)=>{ ctx.save(); ctx.rotate(-total/2+per*(i+0.5)); ctx.translate(0,-rT); ctx.fillText(ch,0,0); ctx.restore(); });
    ctx.restore();
  }
  const cc=[...center];
  if(cc.length){
    const cols=cc.length<=3?1:2, per=Math.ceil(cc.length/cols), fs=cols===1?54:46;
    ctx.font=`700 ${fs}px "Yu Mincho","Hiragino Mincho ProN",serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const gap=fs*1.02;
    for(let col=0;col<cols;col++){
      const list=cc.slice(col*per,col*per+per);
      const x=cx+(cols===1?0:(gap/2-col*gap));
      const y0=cy-(list.length-1)*gap/2;
      list.forEach((ch,r)=> ctx.fillText(ch,x,y0+r*gap));
    }
  }
  return c.toDataURL('image/png');
}

// ===== ステータス =====
function refreshStatus(){
  const s=document.getElementById('status');
  if(seal.done && dateI.done){ s.textContent='準備できました。保存ボタンを押してください。'; s.style.color='#1a9e5a'; }
  else{
    const need=[]; if(!dateI.done) need.push('日付の選択'); if(!seal.done) need.push('ご捺印');
    s.textContent='あと：'+need.join(' と ')+' が必要です'; s.style.color='#8891a8';
  }
}

// ===== 保存 =====
async function savePdf(){
  if(!dateI.done || !seal.done){
    alert((!dateI.done?'日付をタップして選んでください。\n':'')+(!seal.done?'印鑑をタップして捺印してください。':''));
    return;
  }
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='作成中…';
  try{
    const {PDFDocument}=PDFLib;
    const doc=await PDFDocument.load(originalBytes.slice(0));
    const page=doc.getPages()[0];
    const pw=page.getWidth(), ph=page.getHeight();
    for(const it of [dateI, seal]){
      const bytes=await (await fetch(it.dataUrl)).arrayBuffer();
      const png=await doc.embedPng(bytes);
      const w=it.wFrac*pw, h=w*it.aspect;
      page.drawImage(png,{x:it.cx*pw-w/2, y:(1-it.cy)*ph-h/2, width:w, height:h});
    }
    const out=await doc.save();
    const blob=new Blob([out],{type:'application/pdf'});
    const url=URL.createObjectURL(blob); const fname='契約書_捺印済み.pdf';
    const a=document.createElement('a');
    if('download' in a){ a.href=url; a.download=fname; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
    else{ window.open(url,'_blank'); }
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('保存しました。返信メールに添付してお送りください。');
  }catch(err){ alert('作成中にエラーが発生しました：'+err.message); }
  finally{ btn.disabled=false; btn.textContent='押印済みPDFを保存する'; }
}

// ===== トースト =====
let tt;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2800);
}

let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(pdfDoc) renderPage(); },250); });
</script>
</body>
</html>
